[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memnet"
version = "0.1.0"
description = "A tiny CLI knowledge graph for LLM context and memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MemNet contributors" }]
keywords = ["knowledge-graph", "llm", "cli", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
memnet = "memnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memnet"]

[tool.hatch.build.targets.wheel.force-include]
"src/memnet/examples" = "memnet/examples"

[tool.hatch.build.targets.sdist]
only-include = ["src/memnet", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "scheme(id): integration scheme identifier from plan S01-S115",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

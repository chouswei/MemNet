[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memnet-llm"
dynamic = ["version"]
description = "Mission working memory for LLM agents: session graph + pin_map, not a RAG corpus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MemNet contributors" }]
keywords = ["knowledge-graph", "llm", "cli", "memory", "agent", "working-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "rich>=13.9",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/chouswei/MemNet"
Repository = "https://github.com/chouswei/MemNet"
Changelog = "https://github.com/chouswei/MemNet/blob/master/CHANGELOG.md"
Documentation = "https://github.com/chouswei/MemNet/blob/master/docs/LLM-GUIDE.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]
mcp = [
    "mcp>=1.2,<2",
    "uvicorn>=0.30",
]
# Client driver only — does NOT install or vendor an AgensGraph server.
agensgraph = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
memnet = "memnet.cli:main"
memnet-mcp = "memnet_mcp.server:main"

[tool.hatch.version]
path = "parts/common/memnet/memnet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "parts/common/memnet/memnet",
    "parts/memnet-mcp/software/memnet_mcp",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "parts/common/memnet/memnet",
    "parts/memnet-mcp/software/memnet_mcp",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "project.toml",
    "LAYOUT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/grammar/archive --ignore=tests/archive"
pythonpath = [
    "parts/common/memnet",
    "parts/memnet-mcp/software",
]
markers = [
    "scheme(id): integration scheme identifier from plan S01-S115",
    "agensgraph_live: needs MEMNET_AGENSGRAPH_URL pointing at external AgensGraph",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "parts/common/memnet",
    "parts/memnet-mcp/software",
    "tests",
]
exclude = [
    "docs/grammar/archive",
    "tests/archive",
    "tests/grammar/archive",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

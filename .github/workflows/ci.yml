name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the cross-version upgrade tests build 0.20.4 from commit 0a9c7c5.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Ruff check
        run: ruff check parts/common/memnet parts/memnet-mcp/software ops/tip_access_portal tests

      - name: Ruff format (check only)
        run: ruff format --check parts/common/memnet parts/memnet-mcp/software ops/tip_access_portal tests

      - name: Pytest
        run: pytest

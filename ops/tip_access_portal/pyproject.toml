[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memnet-tip-portal"
version = "0.1.0"
description = "Ops sidecar: invite, Google login, and Bearer gate for tip MemNet MCP (tip is not the product face)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette>=0.27",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
memnet-tip-portal = "tip_access_portal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tip_access_portal"]
